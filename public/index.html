<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Стоимость печати</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);--hint:var(--tg-theme-hint-color,#707579);--sec:var(--tg-theme-secondary-bg-color,#f2f3f5);--btn:var(--tg-theme-button-color,#2481cc);--btx:var(--tg-theme-button-text-color,#fff)}
*{box-sizing:border-box}body{margin:0;padding:16px 16px 32px;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 12px}h2{font-size:14px;margin:20px 0 8px;color:var(--hint);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:13px;color:var(--hint)}
input{width:100%;margin-top:4px;padding:10px;border:1px solid transparent;border-radius:10px;background:var(--sec);color:var(--tx);font:inherit}
input:focus{outline:2px solid var(--btn)}.wide{grid-column:1/-1}
.total{margin-top:20px;padding:16px;border-radius:14px;background:var(--sec)}
.total .sum{font-size:32px;font-weight:700}.row{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
.row span:first-child{color:var(--hint)}small{color:var(--hint);display:block;margin-top:12px;font-size:12px}
</style></head><body>
<h1>Стоимость печати</h1>
<h2>Модель</h2>
<div class="grid">
<label>Вес, г<input id="grams" type="number" inputmode="decimal" value="50"></label>
<label>Время печати, ч<input id="hours" type="number" inputmode="decimal" step="0.1" value="3"></label>
<label>Старт печати (час, 0–23)<input id="start" type="number" inputmode="numeric" min="0" max="23" value="12"></label>
<label>Брак/отходы, %<input id="waste" type="number" inputmode="decimal" value="10"></label>
</div>
<h2>Тарифы</h2>
<div class="grid">
<label>Пластик, ₽/кг<input id="kg" type="number" inputmode="decimal"></label>
<label>Мощность принтера, Вт<input id="watt" type="number" inputmode="decimal" value="120"></label>
<label>Свет день, ₽/кВт·ч<input id="day" type="number" inputmode="decimal" step="0.01"></label>
<label>Свет ночь, ₽/кВт·ч<input id="night" type="number" inputmode="decimal" step="0.01"></label>
</div>
<h2>Свои расходы</h2>
<div class="grid">
<label>Износ, ₽/час<input id="wear" type="number" inputmode="decimal" value="10"></label>
<label>Работа, ₽<input id="labor" type="number" inputmode="decimal" value="0"></label>
<label class="wide">Наценка, %<input id="markup" type="number" inputmode="decimal" value="50"></label>
</div>
<div class="total"><div class="sum" id="sum">0 ₽</div>
<div id="rows"></div></div>
<small id="meta"></small>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
const $=id=>document.getElementById(id),n=id=>parseFloat($(id).value)||0,fmt=v=>v.toFixed(2).replace('.',',')+' ₽';
const ids=['grams','hours','start','waste','kg','watt','day','night','wear','labor','markup'];
// Сколько часов печати попадает на ночь (23:00–7:00)
function nightHours(start,hours){let night=0;for(let m=0;m<Math.round(hours*60);m++){const h=((start*60+m)/60)%24;if(h>=23||h<7)night+=1/60}return night}
function calc(){
  const nh=nightHours(n('start'),n('hours')),dh=n('hours')-nh,kw=n('watt')/1000;
  const plastic=n('grams')*(1+n('waste')/100)*n('kg')/1000;
  const power=kw*(dh*n('day')+nh*n('night'));
  const wear=n('hours')*n('wear'),base=plastic+power+wear+n('labor');
  const total=base*(1+n('markup')/100);
  $('sum').textContent=fmt(total);
  $('rows').innerHTML=[['Пластик',plastic],['Электричество',power],['Износ',wear],['Работа',n('labor')],['Себестоимость',base],['Наценка',total-base]]
    .map(([a,b])=>`<div class="row"><span>${a}</span><span>${fmt(b)}</span></div>`).join('');
  localStorage.setItem('calc',JSON.stringify(Object.fromEntries(ids.map(i=>[i,$(i).value]))));
}
ids.forEach(i=>$(i).addEventListener('input',calc));
(async()=>{
  const saved=JSON.parse(localStorage.getItem('calc')||'{}');
  try{
    const r=await (await fetch('/rates.json')).json();
    $('kg').value=r.filament.pricePerKg;$('day').value=r.electricity.day;$('night').value=r.electricity.night;
    $('meta').textContent=`Тарифы обновлены ${r.updated}. ${r.filament.note}. ${r.electricity.note}.`;
  }catch{$('meta').textContent='Не удалось загрузить тарифы. Введите их вручную.'}
  for(const k in saved)if(!['kg','day','night'].includes(k))$(k).value=saved[k];
  calc();
})();
</script></body></html>
